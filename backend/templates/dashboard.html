<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ParleyMind Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light p-4">
  <h2>📊 ParleyMind Performance Dashboard</h2>
  <p>See how your parlays perform over time.</p>

  <div id="summary" class="my-4"></div>
  <div id="bettorStats" class="my-4"></div>
  <div id="sportStats" class="my-4"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    async function loadStats() {
      const res = await axios.get("/api/stats/dashboard");
      const data = res.data;

      document.getElementById("summary").innerHTML = `
        <h4>Overview</h4>
        <p>Total Bets: ${data.total_bets}</p>
        <p>Win Rate: ${data.win_rate}%</p>
        <p>ROI: ${data.roi}%</p>
      `;

      let bettorsHTML = "<h4>Bettor Breakdown</h4>";
      for (const [name, stats] of Object.entries(data.bettor_stats)) {
        bettorsHTML += `<p><b>${name}</b>: ${stats.win_rate}% win rate | ${stats.roi}% ROI (${stats.total_bets} bets)</p>`;
      }
      document.getElementById("bettorStats").innerHTML = bettorsHTML;

      let sportHTML = "<h4>Sport ROI</h4>";
      for (const [sport, roi] of Object.entries(data.sport_roi)) {
        sportHTML += `<p>${sport.toUpperCase()}: ${roi}% ROI</p>`;
      }
      document.getElementById("sportStats").innerHTML = sportHTML;
    }

    loadStats();
  </script>
</body>
</html>
